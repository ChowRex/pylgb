[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylgb"
version = "0.1.0"
authors = [
    { name="ChowRex", email="zrx879582094@gmail.com" },
]
description = "Lark(A.K.A 飞书) Group Bot python API."
readme = "README.md"
license = { file="LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
build = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/ChowRex/pylgb"
Documentation = "https://github.com/ChowRex/pylgb#readme"
